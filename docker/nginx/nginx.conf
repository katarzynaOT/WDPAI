server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _; # _ = localshost
    server_tokens off;

    root /app/src;
    index index.php;

    location / {
        try_files $uri /index.php?$query_string; # Redirect all requests to index.php
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
